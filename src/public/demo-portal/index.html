<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>XO-Code Busters | 公開教材・デモ</title>
  <style>
    :root { font-family: system-ui, "Noto Sans JP", sans-serif; color: #1b2840; background: #f5f8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.65; }
    main { width: min(100% - 2rem, 760px); margin: 0 auto; padding: 2.5rem 0 3rem; }
    .eyebrow { color: #315bb4; font-weight: 800; letter-spacing: .08em; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1.25; margin: .35em 0; }
    h2 { font-size: clamp(1.25rem, 4vw, 1.6rem); line-height: 1.4; margin: 0 0 .6em; }
    p { margin: .5em 0 1em; color: #44536c; }
    .workshop { background: white; border: 1px solid #d9e2f0; border-radius: 16px; padding: clamp(1.2rem, 4vw, 2rem); margin-top: 2rem; box-shadow: 0 4px 16px #263e6810; }
    .tag { font-size: .85rem; font-weight: 700; color: #315bb4; }
    .open { display: inline-block; text-align: center; padding: .8rem 1.2rem; border-radius: 9px; background: #2759b4; color: white; text-decoration: none; font-weight: 700; }
    .open:hover { background: #17458f; }
    .open:focus-visible { outline: 3px solid #315bb4; outline-offset: 4px; }
    @media (max-width: 480px) { .open { display: block; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">⚔️ XO-Code Busters</div>
      <h1>公開教材・デモ</h1>
      <p>設計判断を持ち寄る開発研究会 ～XO-Code Busters 奮闘記～ の公開教材・デモへの入口です。</p>
    </header>
    <section class="workshop" aria-labelledby="rpg-title">
      <p class="tag">ハンズオン講座</p>
      <h2 id="rpg-title">RPGで学ぶ！<br>プログラム改造ハンズオン</h2>
      <p>小さなRPGを動かしながら、プログラムの改造を体験する講座です。</p>
      <a class="open" href="/oop-rpg-workshop/">講座を開く →</a>
    </section>
  </main>
</body>
</html>
