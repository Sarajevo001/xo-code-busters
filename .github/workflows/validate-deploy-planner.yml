name: Validate common static publication planner

on:
  push:
    paths:
      - 'deploy/deploy_projects.py'
      - 'deploy/test_deploy_projects.py'
      - '.github/workflows/validate-deploy-planner.yml'
  pull_request:
    paths:
      - 'deploy/deploy_projects.py'
      - 'deploy/test_deploy_projects.py'
      - '.github/workflows/validate-deploy-planner.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s deploy -p 'test_deploy_projects.py' -v
      - name: Validate empty registry
        run: python3 deploy/deploy_projects.py --checkout-root /srv/GitHub
