name: Validate common static publication planner

on:
  push:
    paths:
      - 'deploy/**'
      - '.github/workflows/validate-deploy-planner.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/validate-deploy-planner.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run planner unit tests
        run: python3 -m unittest discover -s deploy -p 'test_deploy_projects.py' -v
      - name: Run target and update integration tests
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py' -v
      - name: Validate registry syntax
        run: python3 -c "import json; from pathlib import Path; json.loads(Path('deploy/projects.json').read_text(encoding='utf-8'))"
