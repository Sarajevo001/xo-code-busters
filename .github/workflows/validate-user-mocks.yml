name: Validate user management mocks
on:
  push:
    paths:
      - 'src/client/**'
      - 'src/public/js/user-mock.js'
      - 'src/admin-client/**'
      - 'tests/user-management/**'
      - '.github/workflows/validate-user-mocks.yml'
jobs:
  browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/user-management/mock.spec.js --workers=1
